name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: MCP contract and authentication regression tests
        run: npm run test:mcp

      - name: Reimbursement date and filter regression tests
        run: npm run test:reimbursements:usability

      - name: Build
        run: npm run build
